spring.application.name=vesthubApi


spring.datasource.url=jdbc:mysql://localhost:3306/bd_vesthub?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true

# Endereço do front (usado para montar o link do e-mail)
vesthub.front-url=http://127.0.0.1:5500

# E-mail (recuperação de senha)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


