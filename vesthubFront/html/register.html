<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VestHub — Criar conta</title>

    <!-- =========================================================
         Bootstrap 5.3 via CDN
         ========================================================= -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- CSS customizado do projeto (compartilhado com login) -->
    <link rel="stylesheet" href="style.css" />

    <link rel="icon" type="image/png" href="assets/imgs/logo-web.png">

    <!-- Fontes (as mesmas da tela de login) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>
    <!-- =========================================================
         
         ========================================================= -->
    <main id="main-wrapper">

      <!-- =======================================================
           Container do card de registro
           Mobile  : coluna única, fullscreen
           Desktop : linha dividida 50/50, fullscreen
           ======================================================= -->
      <div class="login-card" role="region" aria-label="Área de cadastro">

        <!-- ---------------------------------------------------
             LADO DIREITO (desktop) / TOPO (mobile)
             Banner escuro com textura e logo centralizado
             --------------------------------------------------- -->
        <section class="banner-section" aria-label="Logo VestHub">

          <!-- Logo -->
          <img
            src="assets/imgs/Logo Whit NoBackground.png"
            alt="Logotipo VestHub"
            class="banner-logo"
          />

          <!-- Botão Entrar — visível apenas em telas >= 1024px -->
          <div class="btn-register-desktop" aria-hidden="false">
            <a
              href="login.html"
              class="btn-register-banner"
              aria-label="Criar uma nova conta"
            >
              Entrar
            </a>
            <p class="banner-register-text">Já possui uma conta?</p>
          </div>

        </section>

        <!-- ---------------------------------------------------
             LADO ESQUERDO (desktop) / PARTE INFERIOR (mobile)
             Formulário de registro em fundo branco
             --------------------------------------------------- -->
        <section class="form-section">

          <!-- Título do formulário -->
          <h1 class="form-title">Criar conta</h1>

          <!-- Formulário -->
          <form id="registerForm" novalidate aria-label="Formulário de cadastro">

          <div class="mb-3">
            <label for="nome" class="form-label label-dark">Nome</label>
            <input type="text" id="nome" name="nome" class="form-control custom-input"
                  placeholder="Seu nome" autocomplete="name" maxlength="120"
                  required aria-required="true" aria-describedby="nomeFeedback" />
            <div id="nomeFeedback" class="invalid-feedback">Por favor, informe seu nome.</div>
          </div>  

            <!-- Campo e-mail -->
            <div class="mb-3">
              <label for="email" class="form-label label-dark">
                E-mail
              </label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control custom-input"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
                aria-required="true"
                aria-describedby="emailFeedback"
              />
              <div id="emailFeedback" class="invalid-feedback">
                Por favor, informe um e-mail válido.
              </div>
            </div>

            <!-- Campo senha -->
            <div class="mb-3">
              <label for="senha" class="form-label label-dark">
                Senha
              </label>
              <input
                type="password"
                id="senha"
                name="senha"
                class="form-control custom-input"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="8"
                maxlength="72"
                required
                aria-required="true"
                aria-describedby="senhaFeedback"
              />
              <div id="senhaFeedback" class="invalid-feedback">
                Por favor, crie uma senha.
              </div>
            </div>

            <!-- Campo confirmar senha -->
            <div class="mb-4">
              <label for="confirmarSenha" class="form-label label-dark">
                Confirmar senha
              </label>
              <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                class="form-control custom-input"
                placeholder="••••••••"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="confirmarSenhaFeedback"
              />
              <div id="confirmarSenhaFeedback" class="invalid-feedback">
                As senhas não coincidem.
              </div>
            </div>

            <!-- Botão de envio -->
             <div id="mensagemApi" class="alert d-none" role="alert"></div>

            <button
              type="submit"
              class="btn btn-login w-100"
              aria-label="Criar conta"
            >
              Criar conta
            </button>

            <!-- Link de volta para login -->
            <p class="register-text text-center mt-4">
              Já possui uma conta?
              <a href="login.html" class="register-link" aria-label="Entrar na conta">
                Entrar
              </a>
            </p>

          </form><!-- /#registerForm -->

        </section><!-- /.form-section -->

      </div><!-- /.login-card -->

    </main><!-- /#main-wrapper -->

    <!-- =========================================================
         Bootstrap 5.3 Bundle JS (inclui Popper)
         ========================================================= -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>

  </body>
</html>
