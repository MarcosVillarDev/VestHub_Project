<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VestHub — Início</title>

    <!-- Fontes (as mesmas do login e do cadastro) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3 + Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="icon" type="image/png" href="assets/imgs/logo-web.png" />

    <!-- CSS do projeto: variáveis compartilhadas + estilos desta tela -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/inicio.css" />
  </head>

  <body class="pagina-app">

    <!-- =========================================================
         TOPO
         Celular : barra preta com o logo branco centralizado
         Tablet+ : barra branca com o logo preto e o menu ☰
         ========================================================= -->
    <header class="topo">
      <a href="inicio.html" class="topo-logo" aria-label="VestHub — início">
        <img src="assets/imgs/Logo Whit NoBackground.png" alt="VestHub" class="logo-branco" />
        <img src="assets/imgs/Logo Black NoBackground.png" alt="VestHub" class="logo-preto" />
      </a>

      <button
        type="button"
        class="btn-menu"
        data-bs-toggle="offcanvas"
        data-bs-target="#menuLateral"
        aria-controls="menuLateral"
        aria-label="Abrir menu"
      >
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
    </header>

    <main class="inicio">
  <!-- Vídeo animado do banner (decorativo: aria-hidden) -->
      <section class="hero" aria-hidden="true">
        <video
          class="hero-video"
          src="assets/videos/texture-background-video-upscaled.mp4"
          poster="assets/imgs/banner-handmade-art.png"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </section>

      <!-- =======================================================
           PRÉVIA DO RANKING
           Com notas: os 3 cursos com maior chance
           Sem notas: convite para cadastrar
           ======================================================= -->
      <section class="previa" aria-labelledby="tituloPrevia">
        <p id="saudacaoPrevia" class="previa-saudacao">Olá!</p>
        <h1 id="tituloPrevia" class="previa-titulo">Seus cursos com maior chance</h1>

        <div id="mensagemApi" class="alert d-none" role="alert"></div>

        <!-- Lista montada pelo js/inicio.js -->
        <ol id="listaPrevia" class="previa-lista" aria-live="polite" hidden></ol>

        <!-- Usuário ainda sem notas -->
        <div id="previaVazia" class="previa-vazia" hidden>
          <i class="bi bi-bar-chart previa-vazia-icone" aria-hidden="true"></i>
          <p>Cadastre suas notas para ver os cursos com maior chance de aprovação.</p>
        </div>

        <p id="previaCarregando" class="previa-carregando">Carregando seu ranking...</p>

        <a id="botaoPrevia" href="ranking.html" class="btn btn-login previa-botao" hidden>
          Ver ranking completo
        </a>
      </section>
    </main>

    <!-- =========================================================
         BARRA INFERIOR (só no celular)
         ========================================================= -->
    <nav class="barra-inferior" aria-label="Navegação principal">
      <a href="pesquisa.html" aria-label="Pesquisar cursos">
        <img src="assets/imgs/lupa-arredondada.png" alt="" class="icone-barra" />
      </a>
      <a href="inicio.html" aria-label="Início" aria-current="page">
        <img src="assets/imgs/casa.png" alt="" class="icone-barra" />
      </a>
      <button
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#menuLateral"
        aria-controls="menuLateral"
        aria-label="Minha conta"
      >
        <img src="assets/imgs/perfil.png" alt="" class="icone-barra" />
      </button>
    </nav>

    <!--menu hamburguer lateral-->
    <div class="offcanvas offcanvas-end menu-lateral" tabindex="-1" id="menuLateral" aria-labelledby="saudacaoMenu">
      <div class="offcanvas-header">
        <p id="saudacaoMenu" class="offcanvas-title saudacao">Olá!</p>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>
      </div>
      <div class="offcanvas-body">
        <nav class="menu-links" aria-label="Páginas">
          <a href="inicio.html" aria-current="page"><i class="bi bi-house" aria-hidden="true"></i> Início</a>
          <a href="pesquisa.html"><i class="bi bi-search" aria-hidden="true"></i> Pesquisar</a>
          <a href="notas.html"><i class="bi bi-pencil-square" aria-hidden="true"></i> Minhas notas</a>
          <a href="ranking.html"><i class="bi bi-bar-chart" aria-hidden="true"></i> Ranking</a>
        </nav>
        <button type="button" id="botaoSair" class="btn btn-login w-100 mt-4">Sair</button>
      </div>
    </div>

    <!-- bootstrap, funções da API e comportamento-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/api.js"></script>
    <script src="js/inicio.js"></script>
  </body>
</html>
