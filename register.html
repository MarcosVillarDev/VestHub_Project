<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VestHub — Criar conta</title>

    <!-- =========================================================
         Bootstrap 5.3 via CDN
         ========================================================= -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- CSS customizado do projeto (compartilhado com login) -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================================
         Wrapper principal — ocupa a viewport inteira no desktop
         ========================================================= -->
    <main id="main-wrapper">

      <!-- =======================================================
           Container do card de registro
           Mobile  : coluna única, fullscreen
           Desktop : linha dividida 50/50, fullscreen
           ======================================================= -->
      <div class="login-card" role="region" aria-label="Área de cadastro">

        <!-- ---------------------------------------------------
             LADO DIREITO (desktop) / TOPO (mobile)
             Banner escuro com textura e logo centralizado
             --------------------------------------------------- -->
        <section class="banner-section" aria-label="Logo VestHub">
          <img
            src="assets/imgs/Logo Whit NoBackground.png"
            alt="Logotipo VestHub"
            class="banner-logo"
          />
        </section>

        <!-- ---------------------------------------------------
             LADO ESQUERDO (desktop) / PARTE INFERIOR (mobile)
             Formulário de registro em fundo branco
             --------------------------------------------------- -->
        <section class="form-section">

          <!-- Título do formulário -->
          <h1 class="form-title">Criar conta</h1>

          <!-- Formulário -->
          <form id="registerForm" novalidate aria-label="Formulário de cadastro">

            <!-- Campo e-mail -->
            <div class="mb-3">
              <label for="email" class="form-label label-dark">
                E-mail
              </label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control custom-input"
                placeholder="seuemail@exemplo.com"
                autocomplete="email"
                required
                aria-required="true"
                aria-describedby="emailFeedback"
              />
              <div id="emailFeedback" class="invalid-feedback">
                Por favor, informe um e-mail válido.
              </div>
            </div>

            <!-- Campo senha -->
            <div class="mb-3">
              <label for="senha" class="form-label label-dark">
                Senha
              </label>
              <input
                type="password"
                id="senha"
                name="senha"
                class="form-control custom-input"
                placeholder="••••••••"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="senhaFeedback"
              />
              <div id="senhaFeedback" class="invalid-feedback">
                Por favor, crie uma senha.
              </div>
            </div>

            <!-- Campo confirmar senha -->
            <div class="mb-4">
              <label for="confirmarSenha" class="form-label label-dark">
                Confirmar senha
              </label>
              <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                class="form-control custom-input"
                placeholder="••••••••"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="confirmarSenhaFeedback"
              />
              <div id="confirmarSenhaFeedback" class="invalid-feedback">
                As senhas não coincidem.
              </div>
            </div>

            <!-- Botão de envio -->
            <button
              type="submit"
              class="btn btn-login w-100"
              aria-label="Criar conta"
            >
              Criar conta
            </button>

            <!-- Link de volta para login -->
            <p class="register-text text-center mt-4">
              Já possui uma conta?
              <a href="index.html" class="register-link" aria-label="Entrar na conta">
                Entrar
              </a>
            </p>

          </form><!-- /#registerForm -->

        </section><!-- /.form-section -->

      </div><!-- /.login-card -->

    </main><!-- /#main-wrapper -->

    <!-- =========================================================
         Bootstrap 5.3 Bundle JS (inclui Popper)
         ========================================================= -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmtCF+egqWXh8GtlmJQK+D80kKqp7bv88"
      crossorigin="anonymous"
    ></script>

    <!-- =========================================================
         JavaScript — Validação do formulário de cadastro
         ========================================================= -->
    <script>
      /**
       * Validação do formulário de registro.
       *
       * Estratégia:
       *  1. Intercepta o evento "submit" com preventDefault().
       *  2. Valida cada campo individualmente com checkValidity().
       *  3. Verifica se as duas senhas coincidem.
       *  4. Aplica classes Bootstrap "is-invalid" / "is-valid".
       *  5. Se tudo válido, simula envio com console.log().
       */
      (function () {
        "use strict";

        const form              = document.getElementById("registerForm");
        const emailInput        = document.getElementById("email");
        const senhaInput        = document.getElementById("senha");
        const confirmarInput    = document.getElementById("confirmarSenha");

        /**
         * Aplica feedback visual a um input individual.
         * @param {HTMLInputElement} input - O campo a ser avaliado.
         * @param {boolean} [forceInvalid] - Força estado inválido (ex: senhas diferentes).
         * @returns {boolean} true se válido, false se inválido.
         */
        function validarCampo(input, forceInvalid = false) {
          if (!input.checkValidity() || forceInvalid) {
            input.classList.remove("is-valid");
            input.classList.add("is-invalid");
            return false;
          }
          input.classList.remove("is-invalid");
          input.classList.add("is-valid");
          return true;
        }

        /* Validação em tempo real ao sair do campo (blur) */
        emailInput.addEventListener("blur", () => validarCampo(emailInput));
        senhaInput.addEventListener("blur",  () => validarCampo(senhaInput));

        confirmarInput.addEventListener("blur", () => {
          const senhasIguais = confirmarInput.value === senhaInput.value;
          validarCampo(confirmarInput, !senhasIguais);
        });

        /* Revalida confirmação ao alterar a senha original */
        senhaInput.addEventListener("input", () => {
          if (confirmarInput.classList.contains("is-invalid") ||
              confirmarInput.classList.contains("is-valid")) {
            const senhasIguais = confirmarInput.value === senhaInput.value;
            validarCampo(confirmarInput, !senhasIguais);
          }
        });

        /* Intercepta o envio do formulário */
        form.addEventListener("submit", function (event) {
          event.preventDefault();

          const senhasIguais   = confirmarInput.value === senhaInput.value;

          const emailValido    = validarCampo(emailInput);
          const senhaValida    = validarCampo(senhaInput);
          const confirmValida  = validarCampo(confirmarInput, !senhasIguais);

          if (emailValido && senhaValida && confirmValida) {
            // ✅ Sucesso: todos os campos válidos e senhas coincidem
            console.log("Cadastro enviado com sucesso!");
            console.log("E-mail:", emailInput.value);
            // Em produção, aqui entra a chamada à API / fetch()
          } else {
            // ❌ Falha: foca o primeiro campo inválido
            const primeiroCampoInvalido = form.querySelector(".is-invalid");
            if (primeiroCampoInvalido) primeiroCampoInvalido.focus();
          }
        });
      })();
    </script>

  </body>
</html>
